%YAML 1.1
---
name: CI
'on':
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main
  schedule:
    - cron: 0 06 * * MON
  workflow_dispatch: {}
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
env:
  NIXPKGS_ALLOW_UNFREE: 1
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: "allow-import-from-derivation = false\nextra-substituters = https://devenv.cachix.org https://nix-community.cachix.org file:///tmp/nix-binary-cache?trusted=1\nextra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs="
      - id: nixpkgs
        name: Read nixpkgs pin
        run: echo "rev=$(jq -r '.nodes[.nodes.root.inputs.nixpkgs].locked.rev' flake.lock)" >> "$GITHUB_OUTPUT"
      - name: Restore binary cache
        uses: ./.github/actions/nix-binary-cache/restore
        with:
          key-prefix: nix-binary-cache-${{ runner.os }}-${{ steps.nixpkgs.outputs.rev }}-
          path: /tmp/nix-binary-cache
      - uses: DeterminateSystems/flake-checker-action@v13
      - name: Check flake
        env:
          NIX_SHOW_STATS: 1
          NIX_SHOW_STATS_PATH: nix_eval_stats.json
        run: "set -o pipefail\nnix run github:Mic92/nix-fast-build -- --flake .#checks.x86_64-linux --impure --skip-cached --stream-json-lines 2>&1 | tee nix_fast_build_results.jsonl"
      - id: built-paths
        name: List built paths
        if: github.ref_name == github.event.repository.default_branch
        run: "{\n  echo 'paths<<EOF'\n  jq -Rr 'fromjson? | select(.type == \"BUILD\" and .success) | .outputs[]' nix_fast_build_results.jsonl\n  echo EOF\n} >> \"$GITHUB_OUTPUT\""
      - name: Save binary cache
        if: github.ref_name == github.event.repository.default_branch
        uses: ./.github/actions/nix-binary-cache/save
        with:
          key: nix-binary-cache-${{ runner.os }}-${{ steps.nixpkgs.outputs.rev }}-${{ github.run_id }}
          path: /tmp/nix-binary-cache
          paths: ${{ steps.built-paths.outputs.paths }}
      - name: Upload Nix evaluation statistics
        uses: actions/upload-artifact@v7
        with:
          name: nix-eval-stats-check
          path: nix_eval_stats.json
